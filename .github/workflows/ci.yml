name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ hashFiles('**/package.json') != '' }}
        run: |
          if pnpm run | grep -q 'lint'; then pnpm run lint; else echo "No lint script"; fi

      - name: Typecheck
        run: |
          if pnpm run | grep -q 'typecheck'; then pnpm run typecheck; else echo "No typecheck script"; fi

      - name: Build
        run: |
          if pnpm run | grep -q 'build'; then pnpm run build; else echo "No build script"; fi

      - name: Unit tests with coverage
        run: |
          if pnpm run | grep -q 'test'; then pnpm test -- --coverage || pnpm test; else echo "No test script"; fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/**
            .nyc_output/**
          if-no-files-found: ignore
