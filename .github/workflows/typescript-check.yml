name: TypeScript Type Check

on:
  push:
    branches: [ main, develop, deployment-optimizations ]
  pull_request:
    branches: [ main, develop ]

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.13.1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Run TypeScript type check
      run: |
        echo "🔧 Running TypeScript compilation check..."
        pnpm run typecheck
        
    - name: Count TypeScript errors (if any)
      if: failure()
      run: |
        echo "📊 TypeScript Error Summary:"
        ERROR_COUNT=$(pnpm run type:count)
        echo "Total errors: $ERROR_COUNT"
        echo "First 20 errors:"
        pnpm run type:errors
        exit 1
        
    - name: Run ESLint
      run: |
        echo "🎨 Running ESLint..."
        pnpm run lint
        
    - name: Check build
      run: |
        echo "🏗️ Testing production build..."
        pnpm run build
